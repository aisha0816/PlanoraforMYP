<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planora - Settings</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="navbar">
        <a class="logo" href="index.html">Planora</a>
        <nav class="nav-links" aria-label="Main navigation">
            <a href="index.html">Dashboard</a>
            <a href="tasks.html">Tasks</a>
            <a href="schedule.html">Schedule</a>
            <a href="pomodoro.html">Pomodoro</a>
            <a href="progress.html">Progress</a>
            <a class="active" href="settings.html" aria-current="page">Settings</a>
        </nav>
        <button class="profile" id="account-button" type="button"
            aria-label="Sign up or log in">U</button>
    </header>

    <main class="container">
        <section class="welcome">
            <h1>Settings</h1>
            <p>Customise Planora to suit your study habits</p>
        </section>

        <section class="card">
            <h2>Study preferences</h2>

            <form id="settings-form" class="task-form">
                <label for="focus-duration">Focus duration (minutes)</label>
                <input id="focus-duration" type="number"
                    min="1" max="120" value="25" required>

                <label for="break-duration">Short break (minutes)</label>
                <input id="break-duration" type="number"
                    min="1" max="60" value="5" required>

                <label for="daily-goal">Daily task goal</label>
                <input id="daily-goal" type="number"
                    min="1" max="100" value="5" required>

                <label for="theme-choice">Colour theme</label>
                <select id="theme-choice">
                    <option value="blue">Blue and white</option>
                    <option value="light">Light and neutral</option>
                    <option value="dark">Black and white</option>
                </select>

                <button type="submit">Save settings</button>
            </form>

            <p id="settings-message" role="status"></p>
        </section>
    </main>

    <div id="account-modal" class="modal" hidden>
        <div class="modal-backdrop" id="modal-backdrop"></div>

        <section
            class="modal-content card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="account-title"
            aria-describedby="account-description">

            <button
                id="close-account"
                type="button"
                class="modal-close"
                aria-label="Close account panel">
                &times;
            </button>

            <h2 id="account-title">Create your account</h2>

            <p id="account-description">
                Enter your details to get started with Planora.
            </p>

            <div class="auth-tabs">
                <button id="show-signup" type="button">Sign up</button>
                <button id="show-login" type="button">Log in</button>
            </div>

            <form id="signup-form">
                <label for="signup-name">Your name</label>
                <input
                    id="signup-name"
                    name="name"
                    type="text"
                    autocomplete="name"
                    placeholder="Enter your name"
                    required>

                <label for="signup-email">Email</label>
                <input
                    id="signup-email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required>

                <label for="signup-password">Password</label>
                <input
                    id="signup-password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="6"
                    placeholder="Create a password"
                    required>

                <button type="submit">Create account</button>
            </form>

            <form id="login-form" hidden>
                <label for="login-email">Email</label>
                <input
                    id="login-email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required>

                <label for="login-password">Password</label>
                <input
                    id="login-password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required>

                <button type="submit">Log in</button>
            </form>

            <p id="auth-message" role="status" aria-live="polite"></p>
        </section>
    </div>
</body>
</html>
