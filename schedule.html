
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planora - Schedule</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
    <script src="schedule.js" defer></script>
</head>
<body>
    <header class="navbar">
        <a class="logo" href="index.html">Planora</a>

        <nav class="nav-links" aria-label="Main navigation">
            <a href="index.html">Dashboard</a>
            <a href="tasks.html">Tasks</a>
            <a class="active" href="schedule.html" aria-current="page">Schedule</a>
            <a href="pomodoro.html">Pomodoro</a>
            <a href="progress.html">Progress</a>
            <a href="settings.html">Settings</a>
        </nav>

        <button class="profile" id="account-button" type="button"
            aria-label="Sign up or log in">U</button>
    </header>

    <main class="container">
        <section class="welcome">
            <h1>My Schedule</h1>
            <p>Plan your time and create a balanced study routine.</p>
        </section>

        <section class="card">
            <h2>Plan a study session</h2>

            <form id="schedule-form" class="task-form">
                <label for="session-title">Activity</label>
                <input id="session-title" name="title" type="text"
                    placeholder="e.g. Maths revision" maxlength="150" required>

                <label for="session-date">Date</label>
                <input id="session-date" name="session_date" type="date" required>

                <label for="session-start">Start time</label>
                <input id="session-start" name="start_time" type="time" required>

                <label for="session-end">End time</label>
                <input id="session-end" name="end_time" type="time" required>

                <button id="add-session-button" type="submit">Add session</button>
                <p id="schedule-status" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="card deadlines">
            <h2>Upcoming sessions</h2>
            <ul id="schedule-list">
                <li class="empty-message">Loading sessions...</li>
            </ul>
        </section>
    </main>

    <div id="account-modal" class="modal" hidden>
        <div class="modal-backdrop" id="modal-backdrop"></div>

        <section class="modal-content card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="account-title"
            aria-describedby="account-description">

            <button id="close-account" type="button"
                class="modal-close" aria-label="Close account panel">
                &times;
            </button>

            <h2 id="account-title">Create your account</h2>

            <p id="account-description">
                Enter your details to get started with Planora.
            </p>

            <div class="auth-tabs">
                <button id="show-signup" type="button">Sign up</button>
                <button id="show-login" type="button">Log in</button>
            </div>

            <form id="signup-form">
                <label for="signup-name">Your name</label>
                <input id="signup-name" name="name" type="text"
                    autocomplete="name" placeholder="Enter your name" required>

                <label for="signup-email">Email</label>
                <input id="signup-email" name="email" type="email"
                    autocomplete="email" placeholder="Enter your email" required>

                <label for="signup-password">Password</label>
                <input id="signup-password" name="password" type="password"
                    autocomplete="new-password" minlength="6"
                    placeholder="Create a password" required>

                <button type="submit">Create account</button>
            </form>

            <form id="login-form" hidden>
                <label for="login-email">Email</label>
                <input id="login-email" name="email" type="email"
                    autocomplete="email" placeholder="Enter your email" required>

                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password" required>

                <button type="submit">Log in</button>
            </form>

            <p id="auth-message" role="status" aria-live="polite"></p>
        </section>
    </div>
</body>
</html>
